name: Build img2simg.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-zlib
          base-devel
    
    - name: Create build directory
      run: mkdir -p ${{ github.workspace }}\build
    
    - name: Download source files from GitHub mirror
      shell: powershell
      run: |
        $files = @(
          'img2simg.c', 'sparse.c', 'sparse_crc32.c', 'backed_block.c', 'output_file.c',
          'sparse.h', 'sparse_err.h', 'output_file.h', 'backed_block.h', 'sparse_format.h', 'sparse_defs.h'
        )
        $baseUrl = "https://raw.githubusercontent.com/android/platform_system_core/main/libsparse"
        foreach ($file in $files) {
          Invoke-WebRequest -Uri "$baseUrl/$file" -OutFile "${{ github.workspace }}\build\$file"
        }
        
        # Windows/GCC Hatalarını Önleme Yaması (android-base/macros.h simülasyonu)
        New-Item -Path "${{ github.workspace }}\build\android-base" -ItemType Directory -Force
        '@
        #ifndef ANDROID_BASE_MACROS_H
        #define ANDROID_BASE_MACROS_H
        #define ATTRIBUTE_UNUSED __attribute__((__unused__))
        #endif
        @' | Out-File "${{ github.workspace }}\build\android-base\macros.h" -Encoding ascii

    - name: Compile img2simg.exe with MSYS2
      shell: msys2 {0}
      run: |
        cd "${{ github.workspace }}/build"
        # Windows üzerinde eksik olan tüm C bağımlılıklarını tek komutla derliyoruz
        gcc -O2 -I. -o img2simg.exe img2simg.c sparse.c sparse_crc32.c backed_block.c output_file.c -lz
        
        if [ -f img2simg.exe ]; then
          echo "✓ Derleme Basarili!"
        else
          echo "✗ Derleme Başarısız"
          exit 1
        fi
    
    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: img2simg-windows-binary
        path: ${{ github.workspace }}\build\img2simg.exe
        retention-days: 90
