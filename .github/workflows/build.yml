name: Build Real img2simg

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          base-devel
    
    - name: Create Source
      shell: powershell
      run: |
        mkdir -p "${{ github.workspace }}\build"
        @'
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <stdint.h>

        #if defined(_WIN32) || defined(_WIN64)
            #include <io.h>
            #include <fcntl.h>
            #define FILENO _fileno
            #define COMMIT _commit
        #else
            #include <unistd.h>
            #define FILENO fileno
            #define COMMIT fsync
        #endif

        #define SPARSE_HEADER_MAGIC 0xED26FF3A
        #define CHUNK_TYPE_RAW       0xCAC1
        #define CHUNK_TYPE_DONT_CARE 0xCAC3
        #define BLOCK_SIZE 4096
        #define BUFFER_BLOCKS 1024

        #if defined(_MSC_VER)
            #pragma pack(push, 1)
            #define PACKED
        #else
            #define PACKED __attribute__((packed))
        #endif

        struct PACKED sparse_header {
            uint32_t magic;
            uint16_t major_version;
            uint16_t minor_version;
            uint16_t file_hdr_sz;
            uint16_t chunk_hdr_sz;
            uint32_t blk_sz;
            uint32_t total_blks;
            uint32_t total_chunks;
            uint32_t image_checksum;
        };

        struct PACKED chunk_header {
            uint16_t chunk_type;
            uint16_t reserved1;
            uint32_t chunk_sz;
            uint32_t total_sz;
        };

        #if defined(_MSC_VER)
            #pragma pack(pop)
        #endif

        void write_sparse_header(const struct sparse_header *hdr, FILE *out) {
            uint8_t buf[28];
            memcpy(&buf[0],  &hdr->magic, 4);
            memcpy(&buf[4],  &hdr->major_version, 2);
            memcpy(&buf[6],  &hdr->minor_version, 2);
            memcpy(&buf[8],  &hdr->file_hdr_sz, 2);
            memcpy(&buf[10], &hdr->chunk_hdr_sz, 2);
            memcpy(&buf[12], &hdr->blk_sz, 4);
            memcpy(&buf[16], &hdr->total_blks, 4);
            memcpy(&buf[20], &hdr->total_chunks, 4);
            memcpy(&buf[24], &hdr->image_checksum, 4);
            fwrite(buf, 1, 28, out);
        }

        void write_chunk_header(const struct chunk_header *hdr, FILE *out) {
            uint8_t buf[12];
            memcpy(&buf[0], &hdr->chunk_type, 2);
            memcpy(&buf[2], &hdr->reserved1, 2);
            memcpy(&buf[4], &hdr->chunk_sz, 4);
            memcpy(&buf[8], &hdr->total_sz, 4);
            fwrite(buf, 1, 12, out);
        }

        int is_block_zero(const uint8_t *buf, size_t size) {
            if (size == 0) return 1;
            for (size_t i = 0; i < size; i++) {
                if (buf[i] != 0) return 0;
            }
            return 1;
        }

        int main(int argc, char *argv[]) {
            if (argc < 3) {
                printf("Kullanim: img2simg.exe <ham_girdi> <cikti_sparse>\n");
                return 1;
            }

            FILE *in = fopen(argv[1], "rb");
            if (!in) { perror("Girdi acilamadi"); return 1; }

            FILE *out = fopen(argv[2], "wb");
            if (!out) { perror("Cikti acilamadi"); fclose(in); return 1; }

            fseek(in, 0, SEEK_END);
            long long file_size_raw = ftell(in);
            fseek(in, 0, SEEK_SET);

            if (file_size_raw <= 0) {
                fprintf(stderr, "Hata: Girdi dosyasi gecersiz.\n");
                fclose(in); fclose(out); return 1;
            }

            uint64_t file_size = (uint64_t)file_size_raw;
            uint32_t total_blocks = (uint32_t)((file_size + BLOCK_SIZE - 1) / BLOCK_SIZE);

            struct sparse_header s_hdr = {
                .magic = SPARSE_HEADER_MAGIC, .major_version = 1, .minor_version = 0,
                .file_hdr_sz = 28, .chunk_hdr_sz = 12, .blk_sz = BLOCK_SIZE,
                .total_blks = total_blocks, .total_chunks = 0, .image_checksum = 0
            };
            write_sparse_header(&s_hdr, out);

            uint8_t *buffer = malloc(BUFFER_BLOCKS * BLOCK_SIZE);
            if (!buffer) { perror("Bellek hatasi"); fclose(in); fclose(out); return 1; }

            uint32_t total_chunks = 0;
            uint32_t blocks_processed = 0;

            while (blocks_processed < total_blocks) {
                uint32_t blocks_remaining = total_blocks - blocks_processed;
                uint32_t blocks_to_read = (blocks_remaining > BUFFER_BLOCKS) ? BUFFER_BLOCKS : blocks_remaining;

                memset(buffer, 0, BUFFER_BLOCKS * BLOCK_SIZE);
                size_t bytes_read = fread(buffer, 1, blocks_to_read * BLOCK_SIZE, in);
                if (bytes_read == 0) {
                    if (ferror(in)) { perror("Okuma hatasi"); free(buffer); fclose(in); fclose(out); return 1; }
                    break; 
                }

                uint32_t r_offset = 0;
                while (r_offset < bytes_read) {
                    size_t current_block_bytes = (r_offset + BLOCK_SIZE > bytes_read) ? (bytes_read - r_offset) : BLOCK_SIZE;

                    int is_zero = is_block_zero(&buffer[r_offset], current_block_bytes);
                    uint16_t current_type = is_zero ? CHUNK_TYPE_DONT_CARE : CHUNK_TYPE_RAW;

                    uint32_t run_blocks = 1;
                    while (r_offset + (run_blocks * BLOCK_SIZE) < bytes_read) {
                        size_t next_offset = r_offset + (run_blocks * BLOCK_SIZE);
                        size_t next_block_bytes = (next_offset + BLOCK_SIZE > bytes_read) ? (bytes_read - next_offset) : BLOCK_SIZE;

                        int next_zero = is_block_zero(&buffer[next_offset], next_block_bytes);
                        uint16_t next_type = next_zero ? CHUNK_TYPE_DONT_CARE : CHUNK_TYPE_RAW;

                        if (next_type != current_type) break;
                        run_blocks++;
                    }

                    uint64_t total_chunk_sz_64 = 12 + (current_type == CHUNK_TYPE_RAW ? ((uint64_t)run_blocks * BLOCK_SIZE) : 0);
                    if (total_chunk_sz_64 > UINT32_MAX) { break; } 

                    struct chunk_header c_hdr = {
                        .chunk_type = current_type, .reserved1 = 0,
                        .chunk_sz = run_blocks, .total_sz = (uint32_t)total_chunk_sz_64
                    };
                    write_chunk_header(&c_hdr, out);

                    if (current_type == CHUNK_TYPE_RAW) {
                        fwrite(&buffer[r_offset], 1, run_blocks * BLOCK_SIZE, out);
                    }

                    total_chunks++;
                    r_offset += run_blocks * BLOCK_SIZE;
                    blocks_processed += run_blocks;
                }
            }

            fflush(out);
            COMMIT(FILENO(out)); 

            s_hdr.total_chunks = total_chunks;
            fseek(out, 0, SEEK_SET);
            write_sparse_header(&s_hdr, out);
            fflush(out);

            free(buffer); fclose(in); fclose(out);
            return 0;
        }
        '@ | Out-File "${{ github.workspace }}\build\img2simg.c" -Encoding ascii

    - name: Compile
      shell: msys2 {0}
      run: |
        cd "${{ github.workspace }}/build"
        gcc -O3 -o img2simg.exe img2simg.c
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: img2simg-windows-binary
        path: ${{ github.workspace }}\build\img2simg.exe
