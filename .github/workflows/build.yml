name: Build img2simg.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          base-devel
    
    - name: Create standalone source code
      shell: powershell
      run: |
        mkdir -p "${{ github.workspace }}\build"
        
        @'
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <stdint.h>

        #define SPARSE_HEADER_MAGIC 0xED26FF3A
        #define CHUNK_HEADER_MAGIC 0xCAC1

        typedef struct sparse_header {
            uint32_t magic; uint16_t major_version; uint16_t minor_version;
            uint16_t file_hdr_sz; uint16_t chunk_hdr_sz; uint32_t blk_sz;
            uint32_t total_blks; uint32_t total_chunks; uint32_t image_checksum;
        } sparse_header_t;

        typedef struct chunk_header {
            uint16_t chunk_type; uint16_t reserved1;
            uint32_t chunk_sz; uint32_t total_sz;
        } chunk_header_t;

        int main(int argc, char *argv[]) {
            if (argc < 3) {
                printf("Kullanim: img2simg.exe <girdi> <cikti>\n");
                return 1;
            }

            FILE *in = fopen(argv[1], "rb");
            if (!in) { perror("Girdi acilamadi"); return 1; }

            FILE *out = fopen(argv[2], "wb");
            if (!out) { perror("Cikti acilamadi"); fclose(in); return 1; }

            // Dosya boyutunu bul
            fseek(in, 0, SEEK_END);
            long long file_size = ftell(in);
            fseek(in, 0, SEEK_SET);

            uint32_t block_size = 4096;
            uint32_t total_blocks = (file_size + block_size - 1) / block_size;

            // Tek bir ana parça (chunk) olarak tüm veriyi paketliyoruz
            sparse_header_t s_hdr = {
                .magic = SPARSE_HEADER_MAGIC, .major_version = 1, .minor_version = 0,
                .file_hdr_sz = 28, .chunk_hdr_sz = 12, .blk_sz = block_size,
                .total_blks = total_blocks, .total_chunks = 1, .image_checksum = 0
            };
            fwrite(&s_hdr, 1, sizeof(sparse_header_t), out);

            chunk_header_t c_hdr = {
                .chunk_type = CHUNK_HEADER_MAGIC, .reserved1 = 0,
                .chunk_sz = total_blocks, .total_sz = 12 + (total_blocks * block_size)
            };
            fwrite(&c_hdr, 1, sizeof(chunk_header_t), out);

            // Veriyi 1 MB'lik bloklarla güvenli şekilde kopyala
            char *buffer = malloc(1024 * 1024);
            size_t bytes_read;
            long long total_written = 0;

            while ((bytes_read = fread(buffer, 1, 1024 * 1024, in)) > 0) {
                fwrite(buffer, 1, bytes_read, out);
                total_written += bytes_read;
            }

            // Eğer dosya tam 4096'nin katı değilse sonunu sıfırla doldur
            long long padding = (total_blocks * block_size) - total_written;
            if (padding > 0) {
                char *pad = calloc(1, padding);
                fwrite(pad, 1, padding, out);
                free(pad);
            }

            free(buffer); fclose(in); fclose(out);
            printf("Veri transferi tamamlandi. Toplam: %lld byte işlendi.\n", file_size);
            return 0;
        }
        '@ | Out-File "${{ github.workspace }}\build\img2simg.c" -Encoding ascii

    - name: Compile with MSYS2
      shell: msys2 {0}
      run: |
        cd "${{ github.workspace }}/build"
        gcc -O3 -o img2simg.exe img2simg.c
        
        if [ -f img2simg.exe ]; then
          echo "✓ Derleme Eksiksiz Tamamlandi!"
        else
          exit 1
        fi
    
    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: img2simg-windows-binary
        path: ${{ github.workspace }}\build\img2simg.exe
        retention-days: 90
        
